<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatchMate · Find your next game</title>
  <meta name="description" content="MatchMate: find badminton and football pickup games near you. Standard posts, a live map, and privacy-first joining.">
  <meta name="theme-color" content="#0E7A45">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7A45'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' stroke='%23C8F031' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var th=localStorage.getItem('mm-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}</script>
  <script src="js/i18n.js"></script>
</head>
<body data-page="join">
  <script src="js/layout.js"></script>

  <main id="main" tabindex="-1">
    <section class="page-head" aria-labelledby="page-title">
      <div class="page-head-bg" aria-hidden="true"><span class="orb orb-1"></span><span class="grid-lines"></span></div>
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb" data-intro>
          <a href="index.html" data-i18n="crumb.home">Home</a>
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chev"/></svg>
          <span aria-current="page" data-i18n="nav.join"></span>
        </nav>
        <p class="kicker" data-intro data-i18n="join.kicker"></p>
        <h1 id="page-title" class="h1" data-i18n="join.title"></h1>
        <p class="section-sub" data-intro data-i18n="join.sub"></p>
        <a class="btn btn-ghost btn-sm crumb-back" href="feed.html" data-intro><svg class="icon icon-sm icon-flip" aria-hidden="true"><use href="#i-arrow"/></svg><span data-i18n="join.pick">Choose another game</span></a>
      </div>
    </section>
    <section class="section section-tight join-section">
      <div class="container">
<div class="join-controls">
          <div class="seg seg-dark" role="radiogroup" data-i18n-attr="aria-label:join.mode" aria-label="Demo mode">
            <label><input type="radio" name="join-mode" value="pending" checked><span><svg class="icon icon-sm" aria-hidden="true"><use href="#i-shield"/></svg><span data-i18n="mode.pending">Host approves</span></span></label>
            <label><input type="radio" name="join-mode" value="auto"><span><svg class="icon icon-sm" aria-hidden="true"><use href="#i-zap"/></svg><span data-i18n="mode.auto">Instant join</span></span></label>
          </div>
          <button type="button" class="btn btn-ghost-dark btn-sm" id="join-reset"><svg class="icon icon-sm" aria-hidden="true"><use href="#i-reset"/></svg><span data-i18n="join.reset">Reset demo</span></button>
        </div>

        <div class="join-grid">
          <article class="panel join-player" aria-labelledby="jp-title">
            <header class="pane-head">
              <span class="avatar avatar-ha" aria-hidden="true">HR</span>
              <h3 class="pane-title" id="jp-title" data-i18n="join.player">Player view · Ha.Runner</h3>
            </header>
            <div id="join-player-body"></div>
          </article>

          <article class="panel join-host" aria-labelledby="jh-title">
            <header class="pane-head">
              <span class="avatar avatar-khoa" aria-hidden="true">KS</span>
              <h3 class="pane-title" id="jh-title" data-i18n="join.hostView">Host view · Khoa.Smash</h3>
            </header>
            <div id="join-host-body"></div>
          </article>
        </div>
        <p class="email-log" id="email-log" aria-live="polite"></p>
      </div>
    </section>
  </main>

  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages/join.js"></script>
</body>
</html>
