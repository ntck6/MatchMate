<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MatchMate · Find your next game</title>
  <meta name="description" content="MatchMate: find badminton and football pickup games near you. Standard posts, a live map, and privacy-first joining.">
  <meta name="theme-color" content="#0E7A45">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230E7A45'/%3E%3Cpath d='M8 22V10l8 7 8-7v12' stroke='%23C8F031' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap&subset=vietnamese">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var th=localStorage.getItem('mm-theme');if(th)document.documentElement.setAttribute('data-theme',th);}catch(e){}</script>
  <script src="js/i18n.js"></script>
</head>
<body data-page="about">
  <script src="js/layout.js"></script>

  <main id="main" tabindex="-1">
    <section class="page-head" aria-labelledby="page-title">
      <div class="page-head-bg" aria-hidden="true"><span class="orb orb-1"></span><span class="grid-lines"></span></div>
      <div class="container">
        <nav class="crumbs" aria-label="Breadcrumb" data-intro>
          <a href="index.html" data-i18n="crumb.home">Home</a>
          <svg class="icon icon-sm" aria-hidden="true"><use href="#i-chev"/></svg>
          <span aria-current="page" data-i18n="nav.personas"></span>
        </nav>
        <p class="kicker" data-intro data-i18n="persona.kicker"></p>
        <h1 id="page-title" class="h1" data-i18n="persona.title"></h1>
        <p class="section-sub" data-intro data-i18n="feat.about.d"></p>
      </div>
    </section>
    <section class="section section-tight persona-section">
      <div class="container">
        <div class="persona-grid" id="persona-grid"></div>
      </div>
    </section>
    <section class="section skill-section" aria-labelledby="skill-title">
      <div class="container">
        <p class="kicker reveal" data-i18n="skill.kicker">Shared skill scales</p>
        <h2 id="skill-title" class="h2 reveal" data-i18n="skill.title"></h2>
        <p class="section-sub reveal" data-i18n="skill.sub"></p>
<div class="ladders">
          <div class="ladder ladder-football">
            <h3 class="h3"><svg class="icon" aria-hidden="true"><use href="#i-ball"/></svg><span data-i18n="skill.fb">Football · 6 levels</span></h3>
            <ol class="ladder-steps" id="ladder-football"></ol>
          </div>
          <div class="ladder ladder-badminton">
            <h3 class="h3"><svg class="icon" aria-hidden="true"><use href="#i-shuttle"/></svg><span data-i18n="skill.bm">Badminton · 10 levels</span></h3>
            <ol class="ladder-steps" id="ladder-badminton"></ol>
          </div>
        </div>
      </div>
    </section>
  </main>

  <div class="toast-region" id="toasts" role="status" aria-live="polite"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/core.js"></script>
  <script src="js/pages/about.js"></script>
</body>
</html>
